<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Messages - GigCampus</title>
<link rel="stylesheet" href="style.css">
<style>
  .layout { display: grid; grid-template-columns: 250px 1fr; border: 1px solid #eaeaea; border-radius: 12px; overflow: hidden; min-height: 500px; }
  aside { border-right: 1px solid #eaeaea; background: #fafafa; }
  .contact { padding: 1rem; cursor: pointer; border-bottom: 1px solid #eaeaea; background: #fff; }
  .contact:hover, .contact.active { background: #f3e8ff; }
  .chat { display: flex; flex-direction: column; }
  .chat-header { padding: 1rem; border-bottom: 1px solid #eaeaea; font-weight: bold; }
  .messages { flex-grow: 1; padding: 1rem; overflow-y: auto; background: #fff; display: flex; flex-direction: column; gap: 1rem; }
  .msg { max-width: 70%; padding: 0.8rem 1rem; border-radius: 1rem; font-size: 0.95rem; }
  .msg.received { background: #f3f4f6; align-self: flex-start; border-bottom-left-radius: 0; }
  .msg.sent { background: #6d28d9; color: white; align-self: flex-end; border-bottom-right-radius: 0; }
  .input-area { padding: 1rem; border-top: 1px solid #eaeaea; display: flex; gap: 0.5rem; }
</style>
</head>
<body class="shell">
  <header>
    <a href="index.html" class="logo">GigCampus</a>
    <nav style="display: flex; align-items: center;">
      <a href="index.html">Marketplace</a>
      <a href="dashboard.html">Dashboard</a>
      <a href="messages.html" class="active">Messages</a>
      <a href="post-gig.html">Post Gig</a>
      <a href="login.html" class="btn" style="text-decoration: none; margin-left: 1.5rem;">Log In</a>
    </nav>
  </header>

  <main>
    <h1 style="margin-bottom: 1.5rem;">Messages</h1>
    <div class="layout">
      <aside>
        <div class="contact active">
          <b style="display:block;">Pixel Club</b>
          <span style="font-size:0.8rem; color:#666;">Can you share the first draft...</span>
        </div>
        <div class="contact">
          <b style="display:block;">E-Cell</b>
          <span style="font-size:0.8rem; color:#666;">Thanks for the update!</span>
        </div>
      </aside>
      <section class="chat">
        <div class="chat-header">
          Pixel Club
          <span style="display:block; font-size:0.8rem; color:#666; font-weight:normal;">Portfolio website · Active gig</span>
        </div>
        <div class="messages" id="msgs">
          <div class="msg received">Can you share the first draft by Friday?</div>
          <div class="msg sent">Yes, I will send it for review Thursday evening.</div>
        </div>
        <form class="input-area" onsubmit="event.preventDefault(); const i = document.getElementById('msg'); if(i.value) { document.getElementById('msgs').innerHTML += `<div class='msg sent'>${i.value}</div>`; i.value=''; }">
          <input type="text" id="msg" placeholder="Write a message..." autocomplete="off">
          <button type="submit" class="btn">Send</button>
        </form>
      </section>
    </div>
  </main>
</body>
</html>

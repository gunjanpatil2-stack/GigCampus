<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Messages - Skillbridge</title>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; margin: 0; padding: 0; background-color: #f8f9fa; color: #333; }
    .navbar { display: flex; justify-content: space-between; align-items: center; padding: 1rem 2rem; background-color: white; border-bottom: 1px solid #eaeaea; }
    .logo { font-size: 1.5rem; font-weight: bold; color: #6d28d9; text-decoration: none; }
    .nav-links a { margin-left: 1.5rem; text-decoration: none; color: #555; font-weight: 500; }
    .nav-links a:hover { color: #6d28d9; }
    .container { max-width: 1000px; margin: 2rem auto; padding: 0 1rem; }
    .messages-layout { display: grid; grid-template-columns: 300px 1fr; gap: 2rem; background: white; border-radius: 8px; border: 1px solid #eaeaea; overflow: hidden; min-height: 600px; }
    .conversations { border-right: 1px solid #eaeaea; overflow-y: auto; }
    .conversation-item { padding: 1rem; border-bottom: 1px solid #eaeaea; cursor: pointer; transition: background 0.2s; }
    .conversation-item:hover { background: #f8f9fa; }
    .conversation-item.active { background: #f0e7ff; border-left: 4px solid #6d28d9; }
    .chat-area { display: flex; flex-direction: column; }
    .chat-header { padding: 1rem; border-bottom: 1px solid #eaeaea; background: #f8f9fa; }
    .chat-messages { flex: 1; padding: 1rem; overflow-y: auto; display: flex; flex-direction: column; gap: 1rem; }
    .message { max-width: 70%; padding: 0.8rem 1rem; border-radius: 8px; line-height: 1.4; }
    .message.received { background: #f1f5f9; align-self: flex-start; border-bottom-left-radius: 0; }
    .message.sent { background: #6d28d9; color: white; align-self: flex-end; border-bottom-right-radius: 0; }
    .chat-input { padding: 1rem; border-top: 1px solid #eaeaea; display: flex; gap: 1rem; }
    .chat-input input { flex: 1; padding: 0.8rem; border: 1px solid #ccc; border-radius: 4px; outline: none; }
    .chat-input button { padding: 0.8rem 1.5rem; background: #6d28d9; color: white; border: none; border-radius: 4px; cursor: pointer; font-weight: bold; }
  </style>
</head>
<body>
  <nav class="navbar">
    <a href="index.html" class="logo">Skillbridge</a>
    <div class="nav-links">
      <a href="index.html">Marketplace</a>
      <a href="dashboard.html">Dashboard</a>
      <a href="messages.html" class="active">Messages</a>
      <a href="post-gig.html">Post Gig</a>
      <a href="login.html" class="btn" style="text-decoration: none; margin-left: 1.5rem;">Log In</a>
    </div>
  </nav>

  <div class="container">
    <h1 style="margin-bottom: 1.5rem;">Messages</h1>
    <div class="layout">
      <aside>
        <div class="contact active">
          <b style="display:block;">Pixel Club</b>
          <span style="font-size:0.8rem; color:#666;">Can you share the first draft...</span>
        </div>
        <div class="contact">
          <b style="display:block;">E-Cell</b>
          <span style="font-size:0.8rem; color:#666;">Thanks for the update!</span>
        </div>
      </aside>
      <section class="chat">
        <div class="chat-header">
          Pixel Club
          <span style="display:block; font-size:0.8rem; color:#666; font-weight:normal;">Portfolio website · Active gig</span>
        </div>
        <div class="messages" id="msgs">
          <div class="msg received">Can you share the first draft by Friday?</div>
          <div class="msg sent">Yes, I will send it for review Thursday evening.</div>
        </div>
        <form class="input-area" onsubmit="event.preventDefault(); const i = document.getElementById('msg'); if(i.value) { document.getElementById('msgs').innerHTML += `<div class='msg sent'>${i.value}</div>`; i.value=''; }">
          <input type="text" id="msg" placeholder="Write a message..." autocomplete="off">
          <button type="submit" class="btn">Send</button>
        </form>
      </section>
    </div>
  </main>
</body>
</html>

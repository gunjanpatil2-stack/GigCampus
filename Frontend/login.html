<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login - Skillbridge</title>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; background-color: #f8f9fa; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
    .login-card { background: white; padding: 2.5rem; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); width: 100%; max-width: 400px; text-align: center; }
    h1 { color: #6d28d9; margin-top: 0; }
  </style>
</head>
<body>
  <div class="login-card">
    <h1>Skillbridge</h1>
    <h2>Welcome back</h2>
    
    <form onsubmit="event.preventDefault(); window.location.href='dashboard.html';">
      <div class="field">
        <label for="email">Email</label>
        <input type="email" id="email" required>
      </div>
      <div class="field">
        <label for="password">Password</label>
        <input type="password" id="password" minlength="6" required>
      </div>
      <button type="submit" class="btn">Log in</button>
      <a href="index.html" class="link">Return to Marketplace</a>
    </form>
  </div>
</body>
</html>

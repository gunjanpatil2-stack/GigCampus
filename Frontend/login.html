<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login - GigCampus</title>
<style>
  body { font-family: system-ui, sans-serif; margin: 0; height: 100vh; display: flex; align-items: center; justify-content: center; background: #f9fafb; color: #111; }
  .card { background: white; padding: 2.5rem; border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.05); width: 100%; max-width: 400px; box-sizing: border-box; }
  h1 { margin: 0 0 1.5rem 0; font-size: 1.8rem; text-align: center; }
  .field { margin-bottom: 1.5rem; }
  label { display: block; font-weight: bold; margin-bottom: 0.5rem; font-size: 0.9rem; }
  input { width: 100%; padding: 0.8rem; border: 1px solid #ccc; border-radius: 6px; font-size: 1rem; box-sizing: border-box; }
  .btn { padding: 0.9rem; background: #6d28d9; color: #fff; border: none; border-radius: 6px; cursor: pointer; font-weight: bold; width: 100%; font-size: 1rem; }
  .link { display: block; text-align: center; margin-top: 1.5rem; color: #6d28d9; text-decoration: none; font-size: 0.9rem; font-weight: bold; }
</style>
</head>
<body>
  <div class="card">
    <h1 style="color: #6d28d9; font-weight: 800; font-size: 2rem; margin-bottom: 0.5rem;">GigCampus</h1>
    <h2 style="font-size: 1.2rem; text-align: center; color: #555; margin-bottom: 1.5rem; font-weight: normal;">Welcome back</h2>
    
    <form onsubmit="event.preventDefault(); window.location.href='dashboard.html';">
      <div class="field">
        <label for="email">Email</label>
        <input type="email" id="email" required>
      </div>
      <div class="field">
        <label for="password">Password</label>
        <input type="password" id="password" minlength="6" required>
      </div>
      <button type="submit" class="btn">Log in</button>
      <a href="index.html" class="link">Return to Marketplace</a>
    </form>
  </div>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Post Gig - GigCampus</title>
<style>
  body { font-family: system-ui, sans-serif; margin: 0 auto; padding: 2rem; max-width: 700px; color: #111; }
  header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #eaeaea; padding-bottom: 1rem; margin-bottom: 2rem; }
  .logo { font-size: 1.5rem; font-weight: 800; color: #6d28d9; text-decoration: none; }
  nav a { margin-left: 1.5rem; color: #555; text-decoration: none; font-weight: 500; }
  .card { border: 1px solid #eaeaea; padding: 2rem; border-radius: 12px; }
  .field { margin-bottom: 1.5rem; }
  label { display: block; font-weight: bold; margin-bottom: 0.5rem; font-size: 0.9rem; }
  input, select, textarea { width: 100%; padding: 0.8rem; border: 1px solid #ccc; border-radius: 6px; font-size: 1rem; box-sizing: border-box; }
  textarea { min-height: 100px; resize: vertical; }
  .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; }
  .btn { padding: 1rem; background: #6d28d9; color: #fff; border: none; border-radius: 6px; cursor: pointer; font-weight: bold; width: 100%; font-size: 1rem; }
</style>
</head>
<body>
  <header>
    <a href="index.html" class="logo">GigCampus</a>
    <nav style="display: flex; align-items: center;">
      <a href="index.html">Marketplace</a>
      <a href="dashboard.html">Dashboard</a>
      <a href="messages.html">Messages</a>
      <a href="post-gig.html" style="color: #6d28d9; font-weight: bold;">Post Gig</a>
      <a href="login.html" class="btn" style="text-decoration: none; margin-left: 1.5rem;">Log In</a>
    </nav>
  </header>

  <main>
    <p style="color: #6d28d9; font-weight: bold; margin: 0; font-size: 0.9rem;">CLIENT AREA</p>
    <h1 style="margin-top: 0.2rem; margin-bottom: 2rem;">Post a clear, compelling gig.</h1>
    
    <form class="card" onsubmit="event.preventDefault(); alert('Gig Published successfully!'); window.location.href='index.html';">
      <div class="field">
        <label for="title">Gig title</label>
        <input type="text" id="title" placeholder="e.g. Build a portfolio website" required>
      </div>
      <div class="field">
        <label for="desc">Description</label>
        <textarea id="desc" placeholder="What is the outcome, audience, and acceptance criteria?" required></textarea>
      </div>
      <div class="grid-2 field">
        <div>
          <label for="cat">Category</label>
          <select id="cat">
            <option>Web Development</option>
            <option>Design</option>
            <option>Writing</option>
            <option>Marketing</option>
            <option>Data</option>
          </select>
        </div>
        <div>
          <label for="budget">Budget (₹)</label>
          <input type="number" id="budget" min="1" required>
        </div>
      </div>
      <div class="grid-2 field">
        <div>
          <label for="deadline">Deadline</label>
          <input type="date" id="deadline" required>
        </div>
        <div>
          <label for="skills">Required skills</label>
          <input type="text" id="skills" placeholder="e.g. React, Tailwind">
        </div>
      </div>
      <button type="submit" class="btn">Publish gig</button>
    </form>
  </main>
</body>
</html>

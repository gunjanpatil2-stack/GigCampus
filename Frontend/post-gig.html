<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Post Gig - Skillbridge</title>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; margin: 0; padding: 0; background-color: #f8f9fa; color: #333; }
    .navbar { display: flex; justify-content: space-between; align-items: center; padding: 1rem 2rem; background-color: white; border-bottom: 1px solid #eaeaea; }
    .logo { font-size: 1.5rem; font-weight: bold; color: #6d28d9; text-decoration: none; }
    .nav-links a { margin-left: 1.5rem; text-decoration: none; color: #555; font-weight: 500; }
    .nav-links a:hover { color: #6d28d9; }
  </style>
</head>
<body>
  <nav class="navbar">
    <a href="index.html" class="logo">Skillbridge</a>
    <div class="nav-links">
      <a href="index.html">Marketplace</a>
      <a href="dashboard.html">Dashboard</a>
      <a href="messages.html">Messages</a>
      <a href="post-gig.html" style="color: #6d28d9; font-weight: bold;">Post Gig</a>
      <a href="login.html" class="btn" style="text-decoration: none; margin-left: 1.5rem;">Log In</a>
    </div>
  </nav>

  <main>
    <p style="color: #6d28d9; font-weight: bold; margin: 0; font-size: 0.9rem;">CLIENT AREA</p>
    <h1 style="margin-top: 0.2rem; margin-bottom: 2rem;">Post a clear, compelling gig.</h1>
    
    <form class="card" onsubmit="event.preventDefault(); alert('Gig Published successfully!'); window.location.href='index.html';">
      <div class="field">
        <label for="title">Gig title</label>
        <input type="text" id="title" placeholder="e.g. Build a portfolio website" required>
      </div>
      <div class="field">
        <label for="desc">Description</label>
        <textarea id="desc" placeholder="What is the outcome, audience, and acceptance criteria?" required></textarea>
      </div>
      <div class="grid-2 field">
        <div>
          <label for="cat">Category</label>
          <select id="cat">
            <option>Web Development</option>
            <option>Design</option>
            <option>Writing</option>
            <option>Marketing</option>
            <option>Data</option>
          </select>
        </div>
        <div>
          <label for="budget">Budget (₹)</label>
          <input type="number" id="budget" min="1" required>
        </div>
      </div>
      <div class="grid-2 field">
        <div>
          <label for="deadline">Deadline</label>
          <input type="date" id="deadline" required>
        </div>
        <div>
          <label for="skills">Required skills</label>
          <input type="text" id="skills" placeholder="e.g. React, Tailwind">
        </div>
      </div>
      <button type="submit" class="btn">Publish gig</button>
    </form>
  </main>
</body>
</html>

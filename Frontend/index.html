<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GigCampus</title>
<link rel="stylesheet" href="style.css">
</head>
<body class="shell">
  <header>
    <a href="index.html" class="logo">GigCampus</a>
    <nav style="display: flex; align-items: center;">
      <a href="index.html" class="active">Marketplace</a>
      <a href="dashboard.html">Dashboard</a>
      <a href="messages.html">Messages</a>
      <a href="post-gig.html">Post Gig</a>
      <a href="login.html" class="btn" style="text-decoration: none; margin-left: 1.5rem;">Log In</a>
    </nav>
  </header>

  <main>
    <section id="landing" style="text-align: center; margin: 4rem 0;">
      <h1 style="font-size: 3.5rem; margin-bottom: 1rem; letter-spacing: -0.05em;">Learn. Work. Earn.</h1>
      <p style="font-size: 1.2rem; color: #555; max-width: 600px; margin: 0 auto 2rem;">Find flexible, real-world gigs from campus clubs, startups, and local businesses. Grow your skills and get paid for work you are proud of.</p>
    </section>

    <section id="marketplace">
      <h2>Marketplace</h2>
      <input type="search" id="search" class="search field" style="max-width:350px" placeholder="Search gigs by title...">
      <div id="gigs-container"></div>
    </section>
    </section>

    <dialog id="applyModal">
      <div class="flex-between" style="margin-bottom:1rem">
        <h2 style="margin:0" id="applyTitle">Apply</h2>
        <button class="btn btn-outline" onclick="applyModal.close()" style="padding:0.2rem 0.5rem">×</button>
      </div>
      <form method="dialog" onsubmit="alert('Application sent!');">
        <div class="field">
          <label>Proposal</label>
          <textarea required placeholder="I have relevant experience..."></textarea>
        </div>
        <div class="field">
          <label>Your bid (₹)</label>
          <input type="number" required>
        </div>
        <button class="btn btn-block">Send application</button>
      </form>
    </dialog>
  </main>

  <script>
    const gigs = [
      { id: 1, title: 'Build a portfolio website', desc: 'Need a fast React site for Pixel Club.', budget: 8000, cat: 'Web Dev' },
      { id: 2, title: 'Campus events poster', desc: 'Design a creative poster for the annual tech fest.', budget: 1500, cat: 'Design' },
      { id: 3, title: 'Social media management', desc: 'Manage Instagram page for the E-Cell for 1 month.', budget: 5000, cat: 'Marketing' },
      { id: 4, title: 'Debug Python Script', desc: 'Fix bugs in our data scraping script.', budget: 2500, cat: 'Data' }
    ];
    
    const container = document.getElementById('gigs-container');
    
    const render = (query = '') => {
      container.innerHTML = gigs
        .filter(g => g.title.toLowerCase().includes(query.toLowerCase()))
        .map(g => `
          <article class="card">
            <h3>${g.title} <span class="badge">${g.cat}</span></h3>
            <p>${g.desc}</p>
            <div class="flex-between">
              <b>₹${g.budget.toLocaleString('en-IN')}</b>
              <button class="btn" onclick="applyModal.showModal(); document.getElementById('applyTitle').innerText = 'Apply for ' + '${g.title}'">Apply now</button>
            </div>
          </article>
        `).join('');
    };

    document.getElementById('search').addEventListener('input', e => render(e.target.value));
    render();
  </script>
</body>
</html>
